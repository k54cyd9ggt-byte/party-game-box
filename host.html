<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ホスト | PARTY GAME BOX</title><style>
:root{--bg:#080b16;--card:#14192a;--line:#2c3554;--text:#f7f8ff;--muted:#aab3d1;--accent:#6d7cff;--good:#35d07f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#202957 0,#0b0e1b 42%,#070912 100%);color:var(--text)}
main{max-width:680px;margin:auto;padding:24px 16px}.logo{text-align:center;font-size:38px;margin:24px 0 8px}.sub{text-align:center;color:var(--muted);margin-bottom:26px}
.card{background:rgba(20,25,42,.96);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 16px 50px #0005}
button,a.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px;margin:10px 0;font:inherit;font-weight:850;text-align:center;text-decoration:none;background:var(--accent);color:white;cursor:pointer}
button.secondary,a.secondary{background:#222a43;border:1px solid var(--line)}button.good{background:var(--good);color:#06140c}
input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#0c1120;color:white;font:inherit;margin:6px 0 12px}
label{font-weight:800}.code{font-size:44px;font-weight:950;letter-spacing:8px;text-align:center;margin:10px 0}.muted{color:var(--muted)}.players{display:grid;gap:8px}.player{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1221}.hidden{display:none!important}.status{text-align:center;padding:10px;border-radius:12px;background:#0d1221}.err{color:#ff9b9b}.gameTitle{font-size:30px;text-align:center}
</style></head><body><main>
<div class="logo">👑 パーティを作る</div><div id="setup" class="card"><label>ホスト名</label><input id="name" maxlength="12" placeholder="例：やまと"><label>ゲーム</label><select id="game"><option value="dobon">💣 ドボンしりとり</option><option value="draw">🎨 お絵かき当て</option></select><button id="create">部屋を作る</button><a class="btn secondary" href="./index.html">戻る</a><p id="error" class="err"></p></div>
<div id="room" class="hidden"><div class="card"><div class="muted">ルームコード</div><div id="code" class="code"></div><button id="copy" class="secondary">参加URLをコピー</button></div>
<div class="card"><h2>参加者 <span id="count">0</span>/12</h2><div id="players" class="players"></div></div>
<div class="card"><button id="start" class="good">🎮 ゲームプレイ</button><p class="muted">参加者が揃ったら押してください。</p><p id="status" class="status">待機中</p></div></div></main>
<script>
const DB='https://party-game-box-d129e-default-rtdb.asia-southeast1.firebasedatabase.app'; let roomCode="",poll=null;
const $=id=>document.getElementById(id);
async function api(path,method="GET",body){const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error("Firebase "+r.status);return r.json();}
function code6(){return String(Math.floor(100000+Math.random()*900000));}
async function createRoom(){$("error").textContent="";const n=$("name").value.trim();if(!n){$("error").textContent="ホスト名を入力してください";return;}$("create").disabled=true;
try{for(let i=0;i<8;i++){const c=code6(),old=await api("rooms/"+c);if(old===null){roomCode=c;await api("rooms/"+c,"PUT",{host:n,game:$("game").value,status:"waiting",createdAt:Date.now(),players:{host:{name:n,host:true,joinedAt:Date.now()}}});break;}}
if(!roomCode)throw new Error("部屋を作れませんでした");$("setup").classList.add("hidden");$("room").classList.remove("hidden");$("code").textContent=roomCode;refresh();poll=setInterval(refresh,1500);
}catch(e){$("error").textContent="接続エラー: "+e.message;$("create").disabled=false;}}
async function refresh(){if(!roomCode)return;const r=await api("rooms/"+roomCode);if(!r)return;const ps=Object.values(r.players||{});$("count").textContent=ps.length;$("players").innerHTML=ps.map(p=>'<div class="player">'+(p.host?'👑 ':'🎮 ')+escapeHtml(p.name)+'</div>').join("");$("status").textContent=r.status==="started"?"ゲーム開始！":"待機中";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
$("create").addEventListener("click",createRoom);
$("copy").addEventListener("click",async()=>{const u=new URL("./join.html",location.href);u.searchParams.set("room",roomCode);try{await navigator.clipboard.writeText(u.href);$("copy").textContent="コピーしました ✓";}catch{prompt("このURLをコピーしてください",u.href);}});
$("start").addEventListener("click",async()=>{if(!roomCode)return;await api("rooms/"+roomCode+"/status","PUT","started");await api("rooms/"+roomCode+"/startedAt","PUT",Date.now());location.href="./play.html?room="+encodeURIComponent(roomCode)+"&role=host";});
</script></body></html>
