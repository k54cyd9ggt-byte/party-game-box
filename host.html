<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>パーティを作る</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b15;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:24px 16px}.card{background:#151a2d;border:1px solid #30395d;border-radius:22px;padding:20px;margin:14px 0}h1{text-align:center;font-size:34px}input,select,button{width:100%;font:inherit;font-size:18px;padding:15px;border-radius:14px;margin-top:10px}input,select{background:#0d1221;color:#fff;border:1px solid #354064}button{border:0;background:#6d7cff;color:#fff;font-weight:900}.play{background:#36d27f;color:#06150c}.code{text-align:center;font-size:42px;font-weight:950;letter-spacing:7px}.player{padding:12px;border:1px solid #354064;border-radius:12px;margin-top:8px}.hidden{display:none}.muted{color:#aab3d1}.msg{text-align:center;margin-top:12px}</style></head><body><main>
<h1>👑 パーティを作る</h1><div id="setup" class="card"><input id="name" maxlength="16" placeholder="ホスト名"><select id="gameSel"><option value="dobon">💣 ドボンしりとり</option><option value="draw">🎨 お絵かき当て</option></select><button id="create">パーティを作る</button><div id="setupMsg" class="msg"></div></div>
<div id="roomBox" class="hidden"><div class="card"><div class="muted">ルームコード</div><div id="code" class="code"></div><button id="copy">参加URLをコピー</button></div><div class="card"><h2 id="count"></h2><div id="players"></div></div><div class="card"><button id="play" class="play">🎮 ゲームプレイ</button><div id="status" class="msg">待機中</div></div></div>
</main><script>
const DB='https://party-game-box-d129e-default-rtdb.asia-southeast1.firebasedatabase.app',BASE='/party-game-box/',$=x=>document.getElementById(x);let room='';
async function api(p,m='GET',b){let r=await fetch(DB+'/'+p+'.json',{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw Error(r.status);return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function code(){for(let i=0;i<20;i++){let c=String(Math.floor(100000+Math.random()*900000));if(!(await api('rooms/'+c)))return c}throw Error()}
$('create').addEventListener('click',async()=>{try{let n=$('name').value.trim();if(!n){$('setupMsg').textContent='名前を入力してください';return}room=await code();await api('rooms/'+room,'PUT',{host:n,game:$('gameSel').value,status:'waiting',createdAt:Date.now(),players:{host:{name:n,host:true,joinedAt:Date.now()}}});$('setup').classList.add('hidden');$('roomBox').classList.remove('hidden');$('code').textContent=room;refresh();setInterval(refresh,1200)}catch(e){$('setupMsg').textContent='作成に失敗しました'}});
async function refresh(){if(!room)return;let r=await api('rooms/'+room);if(!r)return;let a=Object.values(r.players||{});$('count').textContent='参加者 '+a.length+'/12';$('players').innerHTML=a.sort((x,y)=>(x.joinedAt||0)-(y.joinedAt||0)).map(p=>'<div class="player">'+(p.host?'👑 ':'🎮 ')+esc(p.name)+'</div>').join('')}
$('copy').addEventListener('click',async()=>{let u=location.origin+BASE+'join.html?room='+room;try{await navigator.clipboard.writeText(u);$('status').textContent='参加URLをコピーしました'}catch(e){prompt('このURLをコピーしてください',u)}});
$('play').addEventListener('click',async()=>{try{$('play').disabled=true;$('status').textContent='ゲームを開始しています…';await api('rooms/'+room+'/status','PUT','started');await api('rooms/'+room+'/startedAt','PUT',Date.now());location.assign(location.origin+BASE+'play.html?room='+encodeURIComponent(room)+'&role=host')}catch(e){$('play').disabled=false;$('status').textContent='開始できませんでした'}});
</script></body></html>
